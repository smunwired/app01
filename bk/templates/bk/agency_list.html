<head>
    <title>Bookings</title>
    <style>
        .row1 {
            background: #EDF3FE;
        }
        .row2 {
            background: white;
        }
        table {
            margin-left: 50px;
            margin-top: 15px;
            column-width: 20px;
            font-size: 12px;
            border: 0;
            padding: 15px;
        }

        thead {
            padding: 10px;
        }

        tbody {
            padding: 10px;
        }
    </style>
</head>

<h1> Agencies </h1> 

<p><a href="types">types</a> <a href="agencies">agencies</a> <a href="bookings">bookings</a></p>

<table>
    <tr><th>name<td><a href="agency/add">add</a></td>
    </tr>
    <!-- Iterate over object_list -->
    {% for object in object_list %}
    <!-- Display Objects -->
<tr>    
    <td> {{ object.name}} </td>
    <td><a href="{% url 'bk:agency-update' object.id %}">edit</a></td>
    <td><a href="{% url 'bk:agency-delete' object.id %}">delete</a></td>
<td> {{ type }} </td> 
<td> {{ agency }} </td> 
<td> {{ booking_date }} </td> 
<td> {{ event_date_from }} </td> 
<td> {{ event_date_to }} </td> 
<td> {{ name }} </td> 
<td> {{ purchase_price }} </td> 
</tr>
    <!-- If object_list is empty  -->
    {% empty %}
    <li>No objects yet.</li>
    {% endfor %}
</table>
