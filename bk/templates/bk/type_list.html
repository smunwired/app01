<head>
    <title>Bookings:Types</title>
    <style>
        .row1 {
            background: #EDF3FE;
        }
        .row2 {
            background: white;
        }
        table {
            margin-left: 50px;
            margin-top: 15px;
            column-width: 20px;
            font-size: 12px;
            border: 0;
            padding: 15px;
        }

        thead {
            padding: 10px;
        }

        tbody {
            padding: 10px;
        }
    </style>
</head>

<h1>Types</h1>

{% include 'bk/links.html' %}

<table>
    <tr><th>name<td><a href="{% url 'bk:type-add' %}">add</a></td>
    </tr>
    <!-- Iterate over object_list -->
    {% for object in object_list %}
    <!-- Display Objects -->
<tr>    
    <td> {{ object.name}} </td>
    <td><a href="{% url 'bk:type-detail' object.id %}">detail</a></td>
    <td><a href="{% url 'bk:type-update' object.id %}">edit</a></td>
    <td><a href="{% url 'bk:type-delete' object.id %}">delete</a></td>
</tr>
    <!-- If object_list is empty  -->
    {% empty %}
    <li>No objects yet.</li>
    {% endfor %}
</table>
