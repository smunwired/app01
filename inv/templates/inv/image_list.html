<table>
    <tr>
        <th>Image<th>Alt<td><th>Instrument<a href="{% url 'inv:image_add' %}">add</a></td>
    </tr>
    <!-- Iterate over object_list -->
    {% for object in object_list %}
    <!-- Display Objects -->
<tr>    
    <td>{{ object.image }}</td>
    <td>{{ object.alt|default_if_none:"&nbsp;" }}</td>
    <td>{{ object.instrument }}</td>
    <td><a href="{% url 'inv:image_detail' object.id %}">detail</a></td>
    <td><a href="{% url 'inv:image_edit' object.id %}">edit</a></td>
    <td><a href="{% url 'inv:image_delete' object.id %}">delete</a></td>
</tr>
    <!-- If object_list is empty  -->
    {% empty %}
    <li>No objects yet.</li>
    {% endfor %}
</table>
