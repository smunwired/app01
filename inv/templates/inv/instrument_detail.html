<h1>{{ object.title }}</h1>
 
 
 
<p>{{ object.badge }}</p>
<p>{{ object.model }}</p>
<p>{{ object.notes }}</p>

<div style="margin-left:20px;margin-top:20px">
<h3>images</h3>
<table>
<th>name<th>alt<th>image<td><a href="{% url 'inv:image_add' %}">add</a></td></tr>
<!-- images in inv are all static -->
{% load static %}
{% for i in instrument.image_set.all %}
  <tr>
    <td>{{i.name}}</td>
    <td>{{i.alt|default_if_none:""}}</td>
    <td><a href="bigger"><img src=" {% static 'inv/' %}{{ i.name }}" width="20" height="20" ></a></td>
    <td><a href="{% url 'inv:image_detail' i.pk %}">detail</a></td>
    <td><a href="{% url 'inv:image_edit' i.pk %}">edit</a></td>
    <td><a href="{% url 'inv:image_delete' i.pk %}">delete</a></td>
  </tr>
{% empty %}
  <p>This instrument has no images.</p>
{% endfor %}
</table>
</div>
