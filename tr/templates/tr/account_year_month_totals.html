<html>
 
<head>
    <title>tr : Account Totals</title>
    <style>
        .row1 {
            background: #EDF3FE;
        }
        .row2 {
            background: white;
        }
        table {
            margin-left: 50px;
            margin-top: 15px;
            column-width: 20px;
            font-size: 12px;
            border: 0;
            padding: 15px;
        }
 
        thead {
            padding: 10px;
        }
 
        tbody {
            padding: 10px;
        }
    </style>
</head>
 
<body>

    <div class="container">
<!--        <table border="5px solid #000;"> -->
        <table border="0" padding="0px;">
            <tbody>
 
                <thead>
                    <tr>
			<th>Account</th><th>Amount</th>
			<th><a href="{% url 'tr:account_add' %}">Add</a></th>
                    </tr>
 
                </thead>
            <tbody>
                {% for i in object_list %}
                <tr  class=" {% cycle "row1" "row2" %} " >
                    <td>{{i.name}}</td>
                    <td>{{i.amount}}</td>
		    <td><a href="{% url 'tr:transaction_account_year_month_list' i.pk i.year i.month %}">List</a></td>
		    <td><a href="{% url 'tr:account_edit' i.pk %}">Edit</a></td>
                    <td><a href="{% url 'tr:account_delete' i.pk %}">Delete</a></td>
                </tr>
                {% endfor %}
            </tbody>
            </tbody>
        </table>
    </div>
    <div class="pagination">
        <span class="step-links">
            {% if page_obj.has_previous %}
                <a href="?page=1">&laquo; first</a>
                <a href="?page={{ page_obj.previous_page_number }}">previous</a>
            {% endif %}
    
            <span class="current">
                Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}.
            </span>
    
            {% if page_obj.has_next %}
                <a href="?page={{ page_obj.next_page_number }}">next</a>
                <a href="?page={{ page_obj.paginator.num_pages }}">last &raquo;</a>
            {% endif %}
        </span>
    </div>
</body>
 
</html>
